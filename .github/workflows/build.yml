name: Build & Release

on:
  push:
    branches: [main, master]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - "helpers/**"
      - "patches/**"
      - "scripts/build-engines.sh"
      - "scripts/build-sympy.sh"
      - "scripts/test-engine.sh"
      - ".github/workflows/build.yml"
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      notarize:
        description: "Sign and notarize (adds up to an hour of Apple queue)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # a push only checks what it changed, so a later push must not cancel it
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Direct pushes to main run the unit tests, and the engine tests when the engine
  # changed. The full app + DMG build for both CPU variants happens once, on the
  # release tag (below), so a version-bump commit and its tag don't compile the app
  # twice on the same SHA.
  test:
    if: github.event_name == 'push' && github.ref_type == 'branch'
    name: Unit tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: swift test
      - name: Math helper tests
        run: |
          ./scripts/build-sympy.sh
          vendor/tosh-sympy/python/bin/python3 -I helpers/tosh-sympy/tests/test_helper.py
          vendor/tosh-sympy/python/bin/python3 -I helpers/tosh-scientific/tests/test_scientific.py
          vendor/tosh-sympy/python/bin/python3 -I helpers/tosh-sympy/tests/test_agent.py
          vendor/tosh-sympy/python/bin/python3 -I helpers/tosh-sympy/tests/test_remote.py

  build:
    # PRs validate a single variant; tags and manual runs build BOTH CPU variants
    # (standard = AVX2, noavx2 = pre-AVX2 legacy) and ship a DMG for each. A branch
    # push only builds and tests the engines, and only when they changed.
    name: Build ${{ matrix.variant }} (x86_64)
    runs-on: macos-26
    # Apple's notary queue took 66 min on this account's first submission.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && fromJSON('["standard","noavx2"]') || fromJSON('["standard"]') }}
    env:
      # The no-AVX2 leg lowers the CPU baseline in build-engines.sh and stamps the
      # bundle (make-app.sh) so the updater keeps it on its own release channel.
      TOSH_NO_AVX2: ${{ matrix.variant == 'noavx2' && '1' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Tags and manual runs build everything; a PR builds unless it only touches documentation; a
      # branch push builds and tests the engines when they or this workflow changed, and never the app.
      - name: Decide what this run builds
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          docs='(^|/).*\.md$|^Assets/lang/|^scripts/(extract-strings|check-translations|translation-status|sync-translations)\.py$|^\.github/|^LICENSE$|^\.gitignore$'
          engine='^patches/|^scripts/(build-engines|test-engine)\.sh$|^\.github/workflows/build\.yml$'
          app=false; engines=false
          if [ "$GITHUB_REF_TYPE" = tag ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            app=true; engines=true
          elif ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            # nothing to compare with (a new branch or a forced push): check all this event can
            engines=true
            [ "$GITHUB_EVENT_NAME" = pull_request ] && app=true
          else
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then range="$BASE_SHA...HEAD"; else range="$BASE_SHA..HEAD"; fi
            changed=$(git diff --name-only "$range")
            if [ -n "$changed" ]; then
              echo "$changed" | grep -Eq "$engine" && engines=true
              if [ "$GITHUB_EVENT_NAME" = pull_request ] && { [ "$engines" = true ] || echo "$changed" | grep -Evq "$docs"; }; then
                app=true; engines=true
              fi
            fi
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "engines=$engines" >> "$GITHUB_OUTPUT"
          echo "Builds the app: **$app**. Builds and tests the engines: **$engines**." >> "$GITHUB_STEP_SUMMARY"

      - name: Cache engine builds
        if: steps.scope.outputs.engines == 'true'
        uses: actions/cache@v5
        with:
          path: vendor
          # Per variant: the two ISA baselines produce different engine binaries.
          key: engines-${{ matrix.variant }}-${{ hashFiles('patches/**/*.patch', 'scripts/build-engines.sh') }}

      # Pinned CPython, SymPy, NumPy and SciPy, checked against their SHA-256. Rebuilt every
      # time: it is a download and an unpack, and the helper sources live outside the engine cache key.
      - name: Build math runtime (x86_64)
        if: steps.scope.outputs.app == 'true'
        run: |
          ARCH=x86_64 ./scripts/build-sympy.sh
          PY=vendor/tosh-sympy/python/bin/python3
          if "$PY" -I -c pass 2>/dev/null; then
            # On an arm64 runner the first import pays for the Rosetta translation of every
            # extension, which is longer than the helper's call timeout.
            "$PY" -I -c "import sympy, numpy, scipy.fft, scipy.signal, scipy.integrate, scipy.optimize, scipy.interpolate, scipy.stats, scipy.linalg"
            "$PY" -I helpers/tosh-sympy/tests/test_helper.py
            "$PY" -I helpers/tosh-scientific/tests/test_scientific.py
            "$PY" -I helpers/tosh-sympy/tests/test_agent.py
            "$PY" -I helpers/tosh-sympy/tests/test_remote.py
          else
            echo "x86_64 runtime cannot run on this runner; its tests ran in the unit test job"
          fi

      # also on tags: the release job waits for this one, not for the unit test job of the push
      - name: Run unit tests
        if: steps.scope.outputs.app == 'true' && matrix.variant == 'standard'
        run: swift test

      - name: Build inference engines (x86_64)
        if: steps.scope.outputs.engines == 'true'
        run: |
          if [ ! -x vendor/llama.cpp/build-static/bin/llama-server ] || \
             [ ! -f vendor/llama.cpp/build-static/bin/default.metallib ] || \
             [ ! -x vendor/whisper.cpp/build-static/bin/whisper-cli ] || \
             [ ! -f vendor/whisper.cpp/build-static/bin/default.metallib ] || \
             [ ! -x vendor/stable-diffusion.cpp/build-static/bin/sd-cli ] || \
             [ ! -f vendor/stable-diffusion.cpp/build-static/bin/default.metallib ]; then
            ARCH=x86_64 ./scripts/build-engines.sh
          else
            echo "Using cached inference engines"
          fi

      # On the engine of this variant; a failure, a missing binary or a runner that cannot run it fails the job
      - name: Engine tests (x86_64)
        if: steps.scope.outputs.engines == 'true'
        timeout-minutes: 20
        run: ./scripts/test-engine.sh -v

      - name: Build app (x86_64)
        if: steps.scope.outputs.app == 'true'
        run: TOSH_ARCH=x86_64 ./make-app.sh

      # Developer ID signing + notarization, skipped when the secrets are absent.
      # A submission can cost an hour in Apple's queue, so only tags get one;
      # everything else keeps the ad-hoc signature unless a manual run opts in.
      - name: Sign and notarize (if secrets configured)
        id: sign
        if: startsWith(github.ref, 'refs/tags/v') || inputs.notarize
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "No signing secrets — keeping ad-hoc signature"
            exit 0
          fi
          echo "$CERT_P12" | base64 -d > /tmp/cert.p12
          security create-keychain -p ci tosh.keychain
          # a new keychain locks itself after 5 minutes, and codesign then waits for a password nobody can type
          security set-keychain-settings -lut 21600 tosh.keychain
          security default-keychain -s tosh.keychain
          security list-keychains -d user -s tosh.keychain login.keychain-db
          security unlock-keychain -p ci tosh.keychain
          security import /tmp/cert.p12 -k tosh.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci tosh.keychain
          IDENTITY=$(security find-identity -v -p codesigning tosh.keychain | grep -oE '"Developer ID Application:[^"]+"' | head -1 | tr -d '"')
          [ -n "$IDENTITY" ] || { echo "::error::the .p12 holds no Developer ID Application identity"; exit 1; }
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

          # Sign inside out: --deep is deprecated and does not apply the hardened
          # runtime to the engine binaries, which notarization rejects.
          APP=dist/ToshLLM.app
          # the math runtime is CPython plus the extension modules and libraries of NumPy and SciPy:
          # every one of them is a Mach-O the notary service checks
          find "$APP/Contents/Resources/tosh-sympy" -type f \( -name '*.so' -o -name '*.dylib' \) -print0 2>/dev/null |
            xargs -0 -n 20 codesign --force --timestamp --options runtime -s "$IDENTITY"
          for exe in "$APP/Contents/Resources/bin/"* "$APP/Contents/Resources/bin-image/"* "$APP/Contents/Resources/bin-audio/"* \
                     "$APP/Contents/Resources/tosh-sympy/python/bin/python3"; do
            [ -f "$exe" ] || continue
            case "$exe" in *.metallib) continue;; esac
            codesign --force --timestamp --options runtime -s "$IDENTITY" "$exe"
          done
          # under the hardened runtime macOS never asks for the microphone without this entitlement
          codesign --force --timestamp --options runtime --entitlements ToshLLM.entitlements -s "$IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements - "$APP" 2>/dev/null | grep -q 'com.apple.security.device.audio-input' ||
            { echo "::error::the signed app lost its microphone entitlement"; exit 1; }

          # Name it per variant: the notary history lists submissions by filename.
          ZIP=/tmp/ToshLLM-${{ matrix.variant }}.zip
          ditto -c -k --keepParent "$APP" "$ZIP"
          xcrun notarytool submit "$ZIP" \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple "$APP"
          spctl -a -vvv -t exec "$APP"

      # The DMG is only consumed by releases; packaging + uploading it on every
      # push/PR just burns time and artifact storage. Only tags and manual runs
      # ship a DMG. make-dmg.sh reads the bundle's variant to name it (-noavx2).
      - name: Package DMG
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [[ "$VERSION" == v* ]] || VERSION="dev-${GITHUB_SHA::7}"
          ./scripts/make-dmg.sh "$VERSION"

      # The app inside is already stapled, but an unsigned disk image still warns
      # on mount, so the DMG gets its own signature and ticket.
      - name: Sign and notarize DMG
        if: steps.sign.outputs.identity != ''
        env:
          IDENTITY: ${{ steps.sign.outputs.identity }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          security unlock-keychain -p ci tosh.keychain
          for dmg in dist/*.dmg; do
            codesign --force --timestamp -s "$IDENTITY" "$dmg"
            xcrun notarytool submit "$dmg" \
              --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" \
              --password "$NOTARY_PASSWORD" --wait
            xcrun stapler staple "$dmg"
            spctl -a -vvv -t open --context context:primary-signature "$dmg"
          done

      # The app needs macOS 14; on macOS 12 the engine runs alone. Only this zip is built for
      # macOS 12 and Metal 2.4, in its own directory: the DMGs above are unchanged.
      - name: Package macOS 12 engine
        if: matrix.variant == 'noavx2' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        env:
          SIGN_IDENTITY: ${{ steps.sign.outputs.identity }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [[ "$VERSION" == v* ]] || VERSION="dev-${GITHUB_SHA::7}"
          [ -z "$SIGN_IDENTITY" ] || security unlock-keychain -p ci tosh.keychain
          ./scripts/make-engine-zip.sh "$VERSION"
          if [ -n "$SIGN_IDENTITY" ]; then
            xcrun notarytool submit dist/toshllm-engine-*-macos12-x86_64.zip \
              --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" \
              --password "$NOTARY_PASSWORD" --wait
          fi

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: dmg-${{ matrix.variant }}
          path: |
            dist/*.dmg
            dist/toshllm-engine-*.zip

  # Collect both variants' DMGs and publish one release with both assets, so the
  # updater can pick the matching one per install (AppInfo.isNoAVX2).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    name: Publish release
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download built DMGs
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dmg-*
          merge-multiple: true

      - name: Checksums
        run: (cd dist && shasum -a 256 *.dmg *.zip > checksums.txt && cat checksums.txt)

      # Pull the section for this tag's version out of CHANGELOG.md so the
      # release body shows the human-written notes; generate_release_notes then
      # appends the auto commit/PR list under it.
      - name: Extract changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { p = 1; next }
            p && /^## \[/ { exit }
            p { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section; stamp the Unreleased header before tagging (scripts/release.sh does it)"
            exit 1
          fi
          echo "----- release body -----"; cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.dmg
            dist/toshllm-engine-*.zip
            dist/checksums.txt
          body_path: release-notes.md
          generate_release_notes: true
